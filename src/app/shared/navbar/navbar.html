<header class="navbar">
  <div class="container navbar__inner">
    <a class="navbar__logo" href="#inicio" (click)="close()" aria-label="Ir al inicio">
      <span class="navbar__mark">JG</span>
      <span class="navbar__name">Juan Esteban Gutiérrez</span>
    </a>

    <nav id="menu-principal" class="navbar__menu" [class.is-open]="menuOpen()" aria-label="Principal">
      <ul>
        @for (link of links; track link.href) {
        <li><a [href]="link.href" (click)="close()">{{ link.label }}</a></li>
        }
        <li><button type="button" (click)="openContact()">Contacto</button></li>
      </ul>
    </nav>

    <div class="navbar__actions">
      <button type="button" class="navbar__theme"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        (click)="theme.toggle()">
        @if (theme.theme() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path
            d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10z M12 1v2 M12 21v2 M4.2 4.2l1.4 1.4 M18.4 18.4l1.4 1.4 M1 12h2 M21 12h2 M4.2 19.8l1.4-1.4 M18.4 5.6l1.4-1.4" />
        </svg>
        } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z" />
        </svg>
        }
      </button>

      <button class="navbar__toggle" type="button" aria-controls="menu-principal" [attr.aria-expanded]="menuOpen()"
        aria-label="Abrir o cerrar el menú" (click)="toggle()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
